version: '3.9'
services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://server:4000
    depends_on:
      - server

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
      SESSION_SECRET: change-me
      ALLOWED_FETCH_DOMAINS: example.com,github.com,developer.mozilla.org,docs.python.org
      ENABLE_WEB_FETCH: 'true'
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  ollama_data:
